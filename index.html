<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Radar de Vagas</title>
<!-- Biblioteca de QR code (se não carregar, a página continua funcionando só com o link) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
  /* ===== CORES (tema claro e escuro) ===== */
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --ink: #1d1c1a;
    --muted: #6d6961;
    --line: #e3e0d8;
    --accent: #0e6b6b;
    --accent-soft: #e0efee;
    --star: #a86a12;
    --star-soft: #f7ecd9;
    --new: #c2410c;
    --new-soft: #fbe7dc;
    --ok: #2f7a3a;
    --ok-soft: #e2f1e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --card: #1d1c1a;
      --ink: #ecebe6;
      --muted: #9e998f;
      --line: #2f2d29;
      --accent: #5cc2bd;
      --accent-soft: #17302f;
      --star: #e4ac4f;
      --star-soft: #33281a;
      --new: #fb8c4c;
      --new-soft: #3a2418;
      --ok: #7fd18a;
      --ok-soft: #1c3320;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; }

  /* ===== CABEÇALHO ===== */
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .sync { margin-top: 12px; }

  /* ===== PAINEL "LEVAR MARCAÇÕES" ===== */
  .painel {
    margin-top: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .painel h3 { margin: 0 0 6px; font-size: 15px; }
  .painel p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .qr {
    display: inline-block;
    background: #ffffff;          /* QR precisa de fundo branco, mesmo no tema escuro */
    padding: 10px;
    border-radius: 8px;
  }
  .qr:empty { display: none; }
  .qr img, .qr canvas { display: block; }
  .link-marcacoes {
    width: 100%;
    margin-top: 10px;
    padding: 8px 10px;
    font: 12px/1.4 ui-monospace, Consolas, monospace;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  /* ===== AVISO (toast) ===== */
  .aviso {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    z-index: 20;
    max-width: calc(100% - 32px);
    background: var(--ink); color: var(--card);
    padding: 10px 16px; border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  /* ===== FILTROS ===== */
  .filtros {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .busca {
    width: 100%;
    padding: 12px 14px;
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .busca:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  select {
    font: inherit; font-size: 14px;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; cursor: pointer; user-select: none;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
  }
  .chip input { accent-color: var(--accent); margin: 0; }
  .contagem { margin-left: auto; color: var(--muted); font-size: 14px; }

  /* ===== CARTÕES DE VAGA ===== */
  .lista { display: grid; gap: 10px; }
  .vaga {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .vaga.candidatei { border-left: 4px solid var(--ok); }
  .vaga.sem_match { opacity: 0.55; }
  .vaga.sem_match h2 a { text-decoration: line-through; }
  .topo { display: flex; gap: 10px; align-items: flex-start; }
  .vaga h2 { margin: 0; font-size: 16px; line-height: 1.35; flex: 1; }
  .vaga h2 a { color: var(--ink); text-decoration: none; }
  .vaga h2 a:hover { color: var(--accent); text-decoration: underline; }
  .nota {
    font-size: 12px; font-weight: 600; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px;
    white-space: nowrap;
  }
  .meta { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .meta strong { color: var(--ink); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: 12px; padding: 2px 8px; border-radius: 6px;
    background: var(--accent-soft); color: var(--accent);
  }
  .tag.star { background: var(--star-soft); color: var(--star); }
  .tag.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .tag.nao { background: var(--line); color: var(--muted); font-weight: 600; }
  .resumo { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 14px; }
  .acoes a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 6px; }
  .acoes a:hover { text-decoration: underline; }
  .btn {
    font: inherit; font-size: 13.5px; cursor: pointer;
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .btn:hover { border-color: var(--muted); }
  .btn.ok.ativo { background: var(--ok); border-color: var(--ok); color: var(--card); }
  .btn.nao.ativo { background: var(--muted); border-color: var(--muted); color: var(--card); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .vazio { text-align: center; color: var(--muted); padding: 40px 0; }

  @media (max-width: 560px) {
    .contagem { margin-left: 0; width: 100%; }
    select { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1> Radar Pessoal de Vagas</h1>
    <p id="atualizado">Carregando…</p>

    <div class="sync">
      <button id="levar" class="btn">📲 Levar marcações para outro aparelho</button>
    </div>

    <div id="painel" class="painel" hidden>
      <h3>Abra este link no outro aparelho</h3>
      <p id="qrDica"></p>
      <div id="qr" class="qr"></div>
      <input id="linkMarcacoes" class="link-marcacoes" type="text" readonly aria-label="Link com as marcações">
      <div class="linha">
        <button id="copiar" class="btn">📋 Copiar link</button>
        <button id="compartilhar" class="btn" hidden>📤 Compartilhar</button>
        <button id="fechar" class="btn">Fechar</button>
      </div>
    </div>
  </header>

  <div class="filtros">
    <input id="busca" class="busca" type="search"
           placeholder="Pesquisar cargo, empresa, cidade ou palavra (ex.: commodities)">
    <div class="linha">
      <select id="fonte"><option value="">Todas as fontes</option></select>
      <select id="modelo">
        <option value="">Qualquer modelo</option>
        <option value="remote">🏠 Remoto</option>
        <option value="hybrid">🏢 Híbrido</option>
        <option value="on-site">📍 Presencial</option>
      </select>
      <select id="ordem">
        <option value="nota">Ordenar: maior nota</option>
        <option value="recentes">Ordenar: publicadas recentemente</option>
        <option value="novas">Ordenar: chegaram por último</option>
      </select>
    </div>
    <div class="linha">
      <label class="chip"><input type="checkbox" id="soNovas"> Só novas de hoje</label>
      <label class="chip"><input type="checkbox" id="soEstrela"> Só ⭐ prioritárias</label>
      <select id="status">
        <option value="pendente">Mostrar: pendentes</option>
        <option value="candidatei">Mostrar: ✅ me candidatei</option>
        <option value="sem_match">Mostrar: ✖ sem match</option>
        <option value="">Mostrar: todas</option>
      </select>
      <span class="contagem" id="contagem"></span>
    </div>
  </div>

  <div class="lista" id="lista"></div>
</div>

<p id="aviso" class="aviso" role="status" hidden></p>

<script>
// ===== 1. ESTADO =====
let dados = { vagas: [], hoje: "" };
let status = carregarStatus();   // { "Gupy-123": "candidatei", "Lever-abc": "sem_match" }

// Os status ficam salvos neste navegador (localStorage).
// Para levar a outro aparelho, use o botão "Levar marcações" (seção 6).
function carregarStatus() {
  try {
    const salvo = JSON.parse(localStorage.getItem("status_vagas") || "{}");
    // traz as marcações da versão antiga (só "Candidatei")
    const antigas = JSON.parse(localStorage.getItem("candidatadas") || "[]");
    antigas.forEach((id) => { if (!salvo[id]) salvo[id] = "candidatei"; });
    return salvo;
  } catch (e) { return {}; }
}
function salvarStatus() {
  try { localStorage.setItem("status_vagas", JSON.stringify(status)); }
  catch (e) { /* navegador sem armazenamento: só não lembra */ }
}
function statusDe(id) { return status[id] || "pendente"; }

// ===== 2. AJUDANTES =====
const $ = (id) => document.getElementById(id);

function semAcento(txt) {
  return (txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function escapar(txt) {
  return (txt || "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function linkSeguro(url) {
  return /^https?:\/\//i.test(url || "") ? url : "#";
}
function dataBR(iso) {
  if (!iso) return "";
  const [a, m, d] = iso.split("-");
  return `${d}/${m}`;
}
const MODELOS = { remote: "🏠 Remoto", hybrid: "🏢 Híbrido", "on-site": "📍 Presencial" };

let timerAviso = null;
function aviso(msg) {
  const el = $("aviso");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(timerAviso);
  timerAviso = setTimeout(() => { el.hidden = true; }, 5000);
}

// ===== 3. DESENHAR A LISTA =====
function desenhar() {
  const termo = semAcento($("busca").value.trim());
  const fonte = $("fonte").value;
  const modelo = $("modelo").value;

  let vagas = dados.vagas.filter((v) => {
    if (fonte && v.fonte !== fonte) return false;
    if (modelo && v.modelo !== modelo) return false;
    if ($("soNovas").checked && v.visto_em !== dados.hoje) return false;
    if ($("soEstrela").checked && v.nota < 10) return false;
    const filtroStatus = $("status").value;
    if (filtroStatus && statusDe(v.id) !== filtroStatus) return false;
    if (termo) {
      const texto = semAcento([v.titulo, v.empresa, v.local, v.resumo].join(" "));
      // todas as palavras digitadas precisam aparecer
      if (!termo.split(/\s+/).every((p) => texto.includes(p))) return false;
    }
    return true;
  });

  const ordem = $("ordem").value;
  vagas.sort((a, b) => {
    if (ordem === "recentes") return (b.publicada || "").localeCompare(a.publicada || "");
    if (ordem === "novas") return (b.visto_em || "").localeCompare(a.visto_em || "") || b.nota - a.nota;
    return b.nota - a.nota;
  });

  const total = { candidatei: 0, sem_match: 0 };
  dados.vagas.forEach((v) => { if (total[statusDe(v.id)] !== undefined) total[statusDe(v.id)]++; });
  $("contagem").textContent =
    `${vagas.length} de ${dados.vagas.length} vagas · ✅ ${total.candidatei} · ✖ ${total.sem_match}`;

  if (!vagas.length) {
    $("lista").innerHTML = `<p class="vazio">Nenhuma vaga com esses filtros.</p>`;
    return;
  }

  $("lista").innerHTML = vagas.map((v) => {
    const st = statusDe(v.id);
    const tags = [];
    if (st === "candidatei") tags.push(`<span class="tag ok">✅ Me candidatei</span>`);
    if (st === "sem_match") tags.push(`<span class="tag nao">✖ Sem match</span>`);
    if (v.visto_em === dados.hoje) tags.push(`<span class="tag new">NOVA</span>`);
    if (v.nota >= 10) tags.push(`<span class="tag star">⭐ prioritária</span>`);
    if (MODELOS[v.modelo]) tags.push(`<span class="tag">${MODELOS[v.modelo]}</span>`);
    tags.push(`<span class="tag">${escapar(v.fonte)}</span>`);
    if (v.publicada) tags.push(`<span class="tag">publicada ${dataBR(v.publicada)}</span>`);

    return `
      <article class="vaga ${st}">
        <div class="topo">
          <h2><a href="${escapar(linkSeguro(v.link))}" target="_blank" rel="noopener">${escapar(v.titulo)}</a></h2>
          <span class="nota" title="Nota do robô">${v.nota} pts</span>
        </div>
        <div class="meta"><strong>${escapar(v.empresa) || "Empresa não informada"}</strong>${v.local ? " · " + escapar(v.local) : ""}</div>
        <div class="tags">${tags.join("")}</div>
        ${v.resumo ? `<p class="resumo">${escapar(v.resumo.slice(0, 220))}${v.resumo.length > 220 ? "…" : ""}</p>` : ""}
        <div class="acoes">
          <a href="${escapar(linkSeguro(v.link))}" target="_blank" rel="noopener">Abrir vaga ↗</a>
          <button class="btn ok ${st === "candidatei" ? "ativo" : ""}" data-id="${escapar(v.id)}" data-status="candidatei"
                  aria-pressed="${st === "candidatei"}">✅ Me candidatei</button>
          <button class="btn nao ${st === "sem_match" ? "ativo" : ""}" data-id="${escapar(v.id)}" data-status="sem_match"
                  aria-pressed="${st === "sem_match"}">✖ Não tem match</button>
        </div>
      </article>`;
  }).join("");
}

// ===== 4. CARREGAR O ARQUIVO DO ROBÔ =====
async function carregar() {
  try {
    const r = await fetch("vagas.json?t=" + Date.now());   // ?t= evita versão velha em cache
    dados = await r.json();
  } catch (e) {
    $("atualizado").textContent = "Não consegui carregar o vagas.json. O robô já rodou?";
    return;
  }
  $("atualizado").textContent =
    `Atualizado em ${dados.atualizado_em} · ${dados.vagas.length} vagas no radar`;

  const fontes = [...new Set(dados.vagas.map((v) => v.fonte))].sort();
  $("fonte").innerHTML += fontes.map((f) => `<option>${escapar(f)}</option>`).join("");
  desenhar();
}

// ===== 5. REAGIR AOS CLIQUES E À DIGITAÇÃO =====
["busca", "fonte", "modelo", "ordem", "soNovas", "soEstrela", "status"]
  .forEach((id) => $(id).addEventListener("input", desenhar));

// Clicar num botão marca o status; clicar de novo no mesmo botão desmarca
$("lista").addEventListener("click", (e) => {
  const botao = e.target.closest("button[data-id]");
  if (!botao) return;
  const id = botao.dataset.id;
  const novo = botao.dataset.status;
  if (statusDe(id) === novo) delete status[id];
  else status[id] = novo;
  salvarStatus();
  desenhar();
});

// ===== 6. LEVAR MARCAÇÕES PARA OUTRO APARELHO =====
// As marcações viajam dentro do próprio link, depois do "#m=".
// O que vem depois do "#" não é enviado ao servidor do GitHub: fica só no navegador.
const CURTO = { candidatei: "c", sem_match: "n" };   // encurta para o link caber no QR code
const LONGO = { c: "candidatei", n: "sem_match" };

// texto → base64 "de URL" (aceita acentos e não usa + / =)
function codificar(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodificar(txt) {
  let b64 = txt.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function montarLink() {
  const curto = {};
  Object.entries(status).forEach(([id, st]) => { if (CURTO[st]) curto[id] = CURTO[st]; });
  const qtd = Object.keys(curto).length;
  if (!qtd) return null;
  return { qtd, link: location.origin + location.pathname + "#m=" + codificar(curto) };
}

function abrirPainel() {
  const pacote = montarLink();
  if (!pacote) { aviso("Ainda não há marcações para levar."); return; }

  $("linkMarcacoes").value = pacote.link;
  $("painel").hidden = false;
  $("compartilhar").hidden = !navigator.share;

  const qr = $("qr");
  qr.innerHTML = "";
  let fezQr = false;
  if (window.QRCode && pacote.link.length <= 2000) {
    try {
      new QRCode(qr, { text: pacote.link, width: 220, height: 220,
                       correctLevel: QRCode.CorrectLevel.L });
      fezQr = true;
    } catch (e) { qr.innerHTML = ""; }
  }
  $("qrDica").textContent = fezQr
    ? `${pacote.qtd} marcações. Aponte a câmera do outro aparelho para o código, ou copie o link.`
    : `${pacote.qtd} marcações. Copie o link ou use Compartilhar (ex.: mandar para você mesma no WhatsApp).`;
}

// Quando a página abre com "#m=..." no endereço, importa as marcações
function importarDoLink() {
  const m = location.hash.match(/^#m=(.+)$/);
  if (!m) return;
  try {
    const recebido = decodificar(m[1]);
    let novas = 0;
    Object.entries(recebido).forEach(([id, c]) => {
      const st = LONGO[c];
      if (st && status[id] !== st) { status[id] = st; novas++; }
    });
    salvarStatus();
    aviso(novas
      ? `${novas} marcação(ões) trazidas do outro aparelho.`
      : "Este aparelho já estava em dia.");
  } catch (e) {
    aviso("Não consegui ler o link de marcações.");
  }
  // limpa o endereço, para não reimportar ao recarregar
  history.replaceState(null, "", location.pathname + location.search);
}

$("levar").addEventListener("click", abrirPainel);
$("fechar").addEventListener("click", () => { $("painel").hidden = true; });
$("copiar").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("linkMarcacoes").value);
    aviso("Link copiado.");
  } catch (e) {
    $("linkMarcacoes").select();
    aviso("Selecionei o link: use Ctrl+C para copiar.");
  }
});
$("compartilhar").addEventListener("click", async () => {
  try {
    await navigator.share({ title: "Marcações do Radar de Vagas", url: $("linkMarcacoes").value });
  } catch (e) { /* compartilhamento cancelado */ }
});
// se o link for colado numa aba que já está aberta
window.addEventListener("hashchange", () => { importarDoLink(); desenhar(); });

importarDoLink();
carregar();
</script>
</body>
</html>
